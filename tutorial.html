<!DOCTYPE html>
<html>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sigmar&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: lightgray;
            color: black;
            margin: 0px;
            text-align: center;
            font-size: 45px;
            font-family: "Merriweather Sans";
        }

        button {
            margin: 0px 30px;
            font-family: "Merriweather Sans";
            font-size: 45px;
            text-align: center;
        }

        h1 {
            font-family: 'Sigmar';
            font-weight: 400;
            font-size: 60px;
            margin-bottom: 5px;
        }

        #site-text {
            position: fixed;
            left: -9999px;
            top: 0;
        }
    </style>
    <script>
        const validSites = [
            "https://realtimehtml.com",
            "https://www.w3schools.com/html/tryit.asp?filename=tryhtml_editor",
            "https://html-viewer.com",
            "https://htmlviewer.org",
            "https://codeconvey.com/en/tools/html-viewer",
            "https://jsfiddle.net/czqvwk08/",
            "https://onecompiler.com/html",
            "https://www.codechef.com/html-online-compiler",
            "www.csgnetwork.com/htmlcodetest.html",
            "https://codetester.io/runner/run-html/",
            "https://thestorywatch.com/html-code-viewer/#editorWrapper"
        ]
    </script>
    <body>
        <h1>Step 1:</h1>
        <button id="copy-text">Copy text</button>
        <h1>Step 2:</h1>
        <button id="visit-site">Visit a site</button> then paste the text in
        <h1>Step 3:</h1>
        Bookmark the site and save the text
        <textarea id="site-text"></textarea>

        <script>
            const siteText = document.getElementById("site-text");
            siteText.textContent = '<base href="https://cdn.jsdelivr.net/gh/0xPYROSPHERE/coolchemgames/"><button id="open">Open</button> <button id="new">New Tab</button><iframe id="site" srcdoc="" style="display: none;"></iframe><script src="embed8.js"><\/script>';
            document.getElementById("copy-text").addEventListener("click", () => {
                siteText.select();
                document.execCommand("copy");
            });

            document.getElementById("visit-site").addEventListener("click", () => {
                window.open(validSites[Math.floor(Math.random() * validSites.length)], "_blank");
            })
        </script>
    </body>
</html>
