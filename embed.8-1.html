        <style>
            body {
                background-color: #36344e;
                margin: 0px;
                padding: 0px;
                width: 100%;
                height: 100%;
                text-align: center;
            }

            #wrapper {
                display: flex;
                position: relative;
                height: 100vh;
                overflow: hidden;
            }

            #games-list, #games-panel {
                list-style: none;
                padding: 0px;
                margin: 0px;
                text-align: left;
                width: 70vw;
                overflow-y: scroll;
                overflow-x: hidden;
            }

            #sidebar-nav {
                list-style-type: none !important;
                margin: 0;
                margin-bottom: 10px;
                padding: 0;
            }

            #games-list li {
                display: flex;
                align-items: center;
                border-bottom: 3px solid gray;
                padding-top: 0px;
                overflow: auto;
            }

            #games-list li a {
                display: inline-block;
                vertical-align: middle;
                color: yellow;
                font-size: 40px;
                font-family: "Sigmar";
                font-weight: 400;
                width: 70%
            }

            #games-list li .game-options {
                margin: 0px 0px 0px auto;
                width: 30%;
                height: 100%;
            }

            .star, .new-tab {
                width: 85px;
                height: 85px;
                display: block;
                margin: auto;
            }

            .new-tab:hover, .star:hover {
                cursor: pointer;
            }

            .star.empty {
                content: url('https://cdn.jsdelivr.net/gh/0xPYROSPHERE/coolchemgames@main/images/icons/star-empty2.svg')
            }

            .star.filled {
                content: url('https://cdn.jsdelivr.net/gh/0xPYROSPHERE/coolchemgames@main/images/icons/star-filled2.svg')
            }

            .star:hover {
                content: url('https://cdn.jsdelivr.net/gh/0xPYROSPHERE/coolchemgames@main/images/icons/star-filled2.svg');
            }

            #games-list li .game-image {
                vertical-align: middle;
                height: 300px;
                width: 400px;
                margin-right: 40px;
                margin-top: 20px;
                margin-bottom: 23px;
                margin-left: 5px;
            }

            #sidebar {
                width: 30vw;
                min-height: 80vh;
                padding-top: 5vh;
                padding-bottom: 5vh;
                overflow-y: scroll;
            }

            #sidebar-nav li {
                margin: 0px;
                padding: 10px;
                font-family: "Merriweather Sans";
                font-size: 20px;
                overflow: hidden;
                text-decoration: underline; 
                cursor: pointer;
                color: lightgray;
            }

            #sidebar-nav li:hover, #sidebar-nav li.selected {
                color: yellow;
            }

            #logo {
                width: 240px;
                height: 180px;
            }

            #suggestion-form, #share-page {
                display: none;
                width: 70vw;
                height: auto;
                background-color: lightgray;
            }

            #share-page {
                font-family: "Merriweather Sans";
                font-size: 24px;
            }

            #share-page h1 {
                color: black;
                font-size: 72px;
                font-family: "Sigmar";
                font-weight: 400;
                margin: 10px;
            }

            #search {
                width: 70vw;
                height: 45px;
                font-family: "Merriweather Sans";
                font-size: 24px;
                background-color: #3b3944;
                color: lightgray;
                padding-left: 15px;
                border-bottom: 3px solid gray;
                border-top: 0;
                border-left: 0;
                border-right: 0;
                box-sizing: border-box;
                position: sticky;
                top: 0;
            }

            #search::-webkit-search-cancel-button {
                display: none;
            }

            a {
                text-decoration: underline;
                cursor: pointer;
            }

            #favorites-empty {
                display: none;
                color: lightgrey;
                font-size: 52px;
                font-family: "Sigmar";
                text-align: center;
            }
        </style>

        <script>
            var favorites = JSON.parse(localStorage.getItem("ccg-favorites")) || [];

            function addFavorite(name) {
                favorites.push(name);
                localStorage.setItem("ccg-favorites", JSON.stringify(favorites));
            }

            function removeFavorite(name) {
                favorites = favorites.filter(item => item != name);
                localStorage.setItem("ccg-favorites", JSON.stringify(favorites));
            }
        </script>
    </head>
    <body>
        <div id="wrapper">
            <aside id="sidebar">
                <img id="logo" src="https://cdn.jsdelivr.net/gh/0xPYROSPHERE/coolchemgames@main/images/icons/logo.png">
                <div id="sidebar-nav">
                    <li id="nav-share">Share</li>
                    <li id="nav-random">Random Game</li>
                    <li class="selected" id="nav-all">All Games</li>
                    <li id="nav-favorites">Favorites</li>
                    <li id="nav-popular">Popular</li>
                    <li id="nav-horror">Horror</li>
                    <li id="nav-endless">Endless</li>
                    <li id="nav-multiplayer">Multiplayer</li>
                    <li id="nav-puzzle">Puzzle</li>
                    <li id="nav-strategy">Strategy</li>
                    <li id="nav-old-school">Old School</li>
                    <li id="nav-driving">Driving</li>
                    <li id="nav-sports">Sports</li>
                    <li id="nav-platformer">Platformer</li>
                    <li id="nav-flash">Flash</li>
                    <li id="nav-casino">Casino</li>
                    <li id="nav-other">Other</li>
                    <li id="nav-duck-life">Duck Life</li>
                    <li id="nav-suggest-games">Suggest Games</li>
                </ul>
            </aside>
            <div id="games-panel">
                <input type="search" id="search" placeholder="Search all games..." incremental>
                <ul id="games-list"></ul>
                <div id="favorites-empty">Click the stars to add games here</div>    
            </div>
            
            <iframe id="suggestion-form" src="https://docs.google.com/forms/d/e/1FAIpQLSfKJVwz6ID4h4FsSEM0iTtlCqYPh6vZzWUlptiZmZAgRt0xkg/viewform?embedded=true" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
            <div id="share-page">
                <img width="350" height="350" src="https://cdn.jsdelivr.net/gh/0xPYROSPHERE/coolchemgames@latest/images/icons/qr2.png">
            </div>
            <script>
                function resolveLink(game) {
                    if (!game.external) {
                        return "https://cdn.jsdelivr.net/gh/0xPYROSPHERE/ccg-files@latest/" + game.url;
                    } else {
                        return game.url;
                    }
                }
                const gamesIdList = Object.keys(GAMES);
                const gamesListElement = document.getElementById("games-list");
                for (let i=0; i<gamesIdList.length; i++) {
                    let gameId = gamesIdList[i];
                    let gameElement = document.createElement("li");
                    gameElement.id = gameId;
                    let gameInfo = GAMES[gameId];
                    let inFavorites = favorites.includes(gameId);
                    gameElement.innerHTML = `
                        <img class="game-image" src="https://cdn.jsdelivr.net/gh/0xPYROSPHERE/coolchemgames@main/images/games/${gameInfo.image}">
                        <a>${gameInfo.name}</a>
                        <div class="game-options">
                            <img class="star ${inFavorites ? "filled" : "empty"}" title="${inFavorites ? "Remove from favorites" : "Add to favorites"}">
                            <img class="new-tab" title="Open in new tab" src="https://cdn.jsdelivr.net/gh/0xPYROSPHERE/coolchemgames@main/images/icons/new-tab3.svg"> 
                        </div>
                    `
                    let favoriteIcon = gameElement.querySelector(".star");
                    favoriteIcon.addEventListener("click", () => {
                        if (!favorites.includes(gameId)) {
                            favoriteIcon.classList.remove("empty");
                            favoriteIcon.classList.add("filled");
                            favoriteIcon.title = "Remove from favorites";
                            addFavorite(gameId);
                        } else {
                            favoriteIcon.classList.remove("filled");
                            favoriteIcon.classList.add("empty");
                            favoriteIcon.title = "Add to favorites";
                            removeFavorite(gameId);
                        }
                    });
                    gameElement.querySelector(".new-tab").addEventListener("click", () => {
                        let linkSource = resolveLink(gameInfo);
                        let template = `
                            <!DOCTYPE html>
                            <html>
                                <head>
                                    <title>New Tab</title>
                                    <style>
                                        body, html {
                                            margin: 0;
                                            padding: 0;
                                            height: 100%;
                                            width: 100%;
                                            overflow: hidden;
                                        }
                                        #game {
                                            position: absolute;
                                            top: 0;
                                            left: 0;
                                            width: 100%;
                                            height: 100%;
                                            border: none;
                                        }
                                    </style>
                                </head>
                                <body>
                                    <iframe id="game"></iframe>
                                    <script>
                                        const gameFrame = document.getElementById("game");
                                        const linkSource = "${linkSource}";
                                        if (linkSource.includes("cdn.jsdelivr.net")) {
                                            fetch(linkSource).then(response => response.text()).then(response => {
                                                gameFrame.srcdoc = response;
                                            });
                                        } else {
                                            gameFrame.src = linkSource;  
                                        }
                                    <\/script>
                                </body>
                            </html>
                        `;
                        let gameWindow = window.open("", "_blank");
                        gameWindow.document.write(template);
                    })
                    gameElement.querySelector("a").addEventListener("click", () => {
                        gtag("event", "page_view", {
                            page_title: gameInfo.name,
                            page_location: "/" + gameId
                        });
                        let linkSource = resolveLink(gameInfo);
                        if (linkSource.includes("cdn.jsdelivr.net")) {
                            fetch(linkSource).then(response => response.text()).then(response => {
                                if (!gameInfo.targetBlank) {
                                    window.frameElement.srcdoc = response;
                                } else {
                                    let gameWindow = window.open("", "_blank");
                                    gameWindow.document.write(response);
                                }
                            });
                        } else {
                            if (!gameInfo.targetBlank) {
                                window.frameElement.removeAttribute("srcdoc");
                                window.frameElement.src = linkSource;
                            } else {
                                window.open(linkSource, "_blank");
                            }
                        }
                    })
                    gamesListElement.appendChild(gameElement);
                }
            </script>
            <script>
                var currentTab = "all";
                var navButtons = document.getElementById("sidebar-nav").children;
                for (let i=0; i<navButtons.length; i++) {
                    let navButton = navButtons[i];
                    navButton.addEventListener("click", () => {
                        if (navButton.id != "nav-random") {
                            document.getElementById("nav-" + currentTab).classList.remove("selected");
                            navButton.classList.add("selected");
                            currentTab = navButton.id.slice(4);
                            updateList();
                        } else {
                            let selectedGame = gamesIdList[Math.floor(Math.random() * gamesIdList.length)];
                            let gameLink = document.getElementById(selectedGame).querySelector("a");
                            gameLink.click();
                        }
                    })
                }

                const gamesPanel = document.getElementById("games-panel");
                const sharePage = document.getElementById("share-page");
                const suggestionForm = document.getElementById("suggestion-form");
                const favoritesEmpty = document.getElementById("favorites-empty");

                function updateList() {
                    favoritesEmpty.style.display = "none";
                    if (currentTab == "suggest-games") {
                        gamesPanel.style.display = "none";
                        sharePage.style.display = "none";
                        suggestionForm.style.display = "block";
                    } else if (currentTab == "share") {
                        gamesPanel.style.display = "none";
                        suggestionForm.style.display = "none";
                        sharePage.style.display = "block";
                    } else {
                        searchBar.placeholder = `Search ${document.getElementById("nav-" + currentTab).textContent.toLowerCase()}...`;
                        let gamesList = document.getElementById("games-list");
                        gamesPanel.style.display = "block";
                        suggestionForm.style.display = "none";
                        sharePage.style.display = "none";
                        gamesPanel.scrollTo(0, 0);
                        let gameItems = gamesList.children;
                        if (currentTab == "all") {
                            for (let i=0; i<gameItems.length; i++) {
                                gameItems[i].style.display = "flex";
                            }
                        } else if (currentTab == "favorites") {
                            for (let i=0; i<gameItems.length; i++) {
                                let gameItem = gameItems[i];
                                if (favorites.includes(gameItem.id)) {
                                    gameItem.style.display = "flex";
                                } else {
                                    gameItem.style.display = "none";
                                }
                            }
                            if (favorites.length == 0) {
                                favoritesEmpty.style.display = "block";
                            }
                        } else {
                            for (let i=0; i<gameItems.length; i++) {
                                let gameItem = gameItems[i];
                                if (GAMES[gameItem.id].categories.includes(currentTab)) {
                                    gameItem.style.display = "flex";
                                } else {
                                    gameItem.style.display = "none";
                                }
                            }
                        }
                        search(searchBar.value);
                    }
                }
            </script>
            <script>
                var searchBar = document.getElementById("search");
                searchBar.addEventListener("search", () => {
                    gamesPanel.scrollTo(0, 0);
                    search(searchBar.value);
                })

                function search(query) {
                    let searchQuery = query.toLowerCase();
                    let gameItems = document.getElementById("games-list").children;
                    for (let i=0; i<gameItems.length; i++) {
                        let gameItem = gameItems[i];
                        let gameObject = GAMES[gameItem.id];
                        if (currentTab == "all" || (currentTab == "favorites" && favorites.includes(gameItem.id)) || gameObject.categories.includes(currentTab)) {
                            let gameName = gameObject.name.toLowerCase();
                            gameItem.style.display = gameName.includes(searchQuery) ? "flex" : "none";
                        }
                    }
                }
            </script>
        </div>
    </body>
</html>
