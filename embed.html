        <style>
            body {
                background-color: #36344e;
                margin: 0px;
                padding: 0px;
                width: 100%;
                height: 100%;
                text-align: center;
            }

            #wrapper {
                display: flex;
                position: relative;
                height: 100vh;
                overflow: hidden;
            }

            #games-list, #games-panel {
                list-style: none;
                padding: 0px;
                margin: 0px;
                text-align: left;
                width: 70vw;
                overflow-y: scroll;
                overflow-x: hidden;
            }

            #sidebar-nav {
                list-style-type: none !important;
                margin: 0;
                margin-bottom: 10px;
                padding: 0;
            }

            #games-list li {
                display: flex;
                align-items: center;
                border-bottom: 3px solid gray;
                padding-top: 0px;
                padding-right: 0px;
                overflow: auto;
            }

            #games-list li a {
                display: inline-block;
                vertical-align: middle;
                color: yellow;
                font-size: 40px;
                vertical-align: middle;
                font-family: "Sigmar";
                font-weight: 400;
                margin-right: 50px;
            }

            #games-list li img {
                vertical-align: middle;
                height: 300px;
                width: 400px;
                margin-right: 40px;
                margin-top: 20px;
                margin-bottom: 23px;
                margin-left: 5px;
            }

            #sidebar {
                width: 30vw;
                min-height: 80vh;
                padding-top: 5vh;
                padding-bottom: 5vh;
                overflow-y: scroll;
            }

            #sidebar-nav li {
                margin: 0px;
                padding: 10px;
                font-family: "Merriweather Sans";
                font-size: 20px;
                overflow: hidden;
                text-decoration: underline; 
                cursor: pointer;
                color: lightgray;
            }

            #sidebar-nav li:hover, #sidebar-nav li.selected {
                color: yellow;
            }

            #logo {
                width: 240px;
                height: 180px;
            }

            #suggestion-form, #share-page {
                display: none;
                width: 70vw;
                height: auto;
                background-color: lightgray;
            }

            #share-page {
                font-family: "Merriweather Sans";
                font-size: 24px;
            }

            #share-page h1 {
                color: black;
                font-size: 72px;
                font-family: "Sigmar";
                font-weight: 400;
                margin: 10px;
            }

            #search {
                width: 70vw;
                height: 45px;
                font-family: "Merriweather Sans";
                font-size: 24px;
                background-color: #3b3944;
                color: lightgray;
                padding-left: 15px;
                border-bottom: 3px solid gray;
                border-top: 0;
                border-left: 0;
                border-right: 0;
                box-sizing: border-box;
                position: sticky;
                top: 0;
            }

            #search::-webkit-search-cancel-button {
                display: none;
            }

    <body>
        <div id="wrapper">
            <aside id="sidebar">
                <img id="logo" src="https://cdn.jsdelivr.net/gh/0xPYROSPHERE/coolchemgames@main/images/icons/logo.png">
                <div id="sidebar-nav">
                    <li id="nav-share">Share</li>
                    <li id="nav-random">Random Game</li>
                    <li class="selected" id="nav-all">All Games</li>
                    <li id="nav-popular">Popular</li>
                    <li id="nav-horror">Horror</li>
                    <li id="nav-endless">Endless</li>
                    <li id="nav-multiplayer">Multiplayer</li>
                    <li id="nav-old-school">Old School</li>
                    <li id="nav-sports">Sports</li>
                    <li id="nav-mobile">Mobile</li>
                    <li id="nav-flash">Flash</li>
                    <li id="nav-casino">Casino</li>
                    <li id="nav-other">Other</li>
                    <li id="nav-duck-life">Duck Life</li>
                    <li id="nav-suggest-games">Suggest Games</li>
                </ul>
            </aside>
            <div id="games-panel">
                <input type="search" id="search" placeholder="Search all games..." incremental>
                <ul id="games-list"></ul>    
            </div>
            
            <iframe id="suggestion-form" src="https://docs.google.com/forms/d/e/1FAIpQLSfKJVwz6ID4h4FsSEM0iTtlCqYPh6vZzWUlptiZmZAgRt0xkg/viewform?embedded=true" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
            <div id="share-page">
                <h1>tinyurl.com/2eunzc9t</h1><br>
                <a id="sites-link" target="_blank" href="https://sites.google.com/view/coolchemgames">Google Sites Version</a>
            </div>
            <script>
                const gamesIdList = Object.keys(GAMES);
                const gamesListElement = document.getElementById("games-list");
                for (let i=0; i<gamesIdList.length; i++) {
                    let gameId = gamesIdList[i];
                    let gameElement = document.createElement("li");
                    gameElement.id = gameId;
                    let gameInfo = GAMES[gameId];
                    gameElement.innerHTML = `
                        <img src="https://cdn.jsdelivr.net/gh/0xPYROSPHERE/coolchemgames@main/images/games/${gameInfo.image}">
                        <a href="">${gameInfo.name}</a>
                    `
                    gameElement.querySelector("a").addEventListener("click", () => {
                        fetch(!gameInfo.external ? "scripts/" : "" + gameInfo.url).then(response => response.text()).then(response => {window.frameElement.srcdoc = response;})
                    })
                    gamesListElement.appendChild(gameElement);
                }
            </script>
            <script>
                var currentTab = "all";
                var navButtons = document.getElementById("sidebar-nav").children;
                for (let i=0; i<navButtons.length; i++) {
                    let navButton = navButtons[i];
                    navButton.addEventListener("click", () => {
                        if (navButton.id != "nav-random") {
                            document.getElementById("nav-" + currentTab).classList.remove("selected");
                            navButton.classList.add("selected");
                            currentTab = navButton.id.slice(4);
                            updateList();
                        } else {
                            let selectedGame = gamesIdList[Math.floor(Math.random() * gamesIdList.length)];
                            let gameLink = document.getElementById(selectedGame).querySelector("a");
                            gameLink.click();
                        }
                    })
                }

                function updateList() {
                    if (currentTab == "suggest-games") {
                        document.getElementById("games-panel").style.display = "none";
                        document.getElementById("share-page").style.display = "none";
                        document.getElementById("suggestion-form").style.display = "block";
                    } else if (currentTab == "share") {
                        document.getElementById("games-panel").style.display = "none";
                        document.getElementById("suggestion-form").style.display = "none";
                        document.getElementById("share-page").style.display = "block";
                        if (CONTEXT == "sites") {
                            document.getElementById("sites-link").style.display = "none";
                        }   
                    } else {
                        searchBar.placeholder = `Search ${document.getElementById("nav-" + currentTab).textContent.toLowerCase()}...`;
                        let gamesList = document.getElementById("games-list");
                        document.getElementById("games-panel").style.display = "block";
                        document.getElementById("suggestion-form").style.display = "none";
                        document.getElementById("share-page").style.display = "none";
                        document.getElementById("games-panel").scrollTo(0, 0);
                        let gameItems = gamesList.children;
                        if (currentTab == "all") {
                            for (let i=0; i<gameItems.length; i++) {
                                gameItems[i].style.display = "flex";
                            }
                        } else {
                            for (let i=0; i<gameItems.length; i++) {
                                let gameItem = gameItems[i];
                                if (GAMES[gameItem.id].categories.includes(currentTab)) {
                                    gameItem.style.display = "flex";
                                } else {
                                    gameItem.style.display = "none";
                                }
                            }
                        }
                        search(searchBar.value);
                    }
                }
            </script>
            <script>
                var searchBar = document.getElementById("search");
                searchBar.addEventListener("search", () => {
                    search(searchBar.value);
                })

                function search(query) {
                    let searchQuery = query.toLowerCase();
                    let gameItems = document.getElementById("games-list").children;
                    for (let i=0; i<gameItems.length; i++) {
                        let gameItem = gameItems[i];
                        let gameObject = GAMES[gameItem.id];
                        if (currentTab == "all" || gameObject.categories.includes(currentTab)) {
                            let gameName = gameObject.name.toLowerCase();
                            gameItem.style.display = gameName.includes(searchQuery) ? "flex" : "none";
                        }
                    }
                }
            </script>
        </div>
    </body>
