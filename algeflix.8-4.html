        <style>
            body, html {
                margin: 0px;
                overflow-x: hidden;
                height: 100vh;
                width: 100vw;
                background-color: black;
            }

            #logo {
                display: block;
                margin-left: auto;
                margin-right: auto;
                margin-top: 25px;
                margin-bottom: 25px;
                width: 10%;
                aspect-ratio: auto;
            }

            #content {
                margin: 0;
                border-top: 2px solid rgb(115, 115, 115);
            }

            #videos {
                display: inline;
                padding: 0px;
                margin: 0px;
                user-select: none;
            }

            #videos a, #videos summary, #search {
                display: flex;
                align-items: center;
                font-family: 'Merriweather Sans';
                font-size: 30px;
                height: 50px;
                width: 100vw;
                border-bottom: 2px solid rgb(115, 115, 115);
                border-top: 0;
                padding-left: 15px;
                text-decoration: none;
            }
            
            #videos details a {
                background-color: #777777;
                color: rgb(200, 200, 200);
                border-bottom-color: black;
                padding-left: 60px;
            }

            #videos details a:hover {
                background-color: #2f2f2f;
            }

            #videos a, summary {
                background-color: #2f2f2f;
                color: lightgray;
                cursor: pointer;
            }

            #videos a:hover {
                background-color: #777777;
            }

            summary::before {
                content: "[+] ";
                margin-right: 10px
            }

            details[open] summary::before {
                content: "[-] "
            }

            #search {
                margin: 0px;
                background-color: #777777;
                color: rgb(200, 200, 200);
            }

            #search::placeholder {
                color: rgb(57, 57, 57);
            }

            #search::-webkit-search-cancel-button {
                display: none;
            }
        </style>

        <a href="index.svg"><img id="logo" src="https://cdn.jsdelivr.net/gh/0xPYROSPHERE/coolchemgames@main/images/icons/algeflix.png"></a>
        <div id="content">
            <input type="search" id="search" placeholder="Search..." incremental>
            <div id="videos"></div>
        </div>
        <script>
            function insertLinks(container, itemList) {
                for (let i=0;i<itemList.length;i++) {
                    let link = document.createElement("a");
                    link.href = "?v=" + itemList[i].id;
                    link.textContent = itemList[i].name;
                    container.append(link);
                }  
            }
            const linksList = document.getElementById("videos");

            for (let i=0; i<ITEMS.series.length; i++) {
                let series = ITEMS.series[i];
                let detailsElement = document.createElement("details");
                detailsElement.innerHTML = `<summary>${series.name}</summary`;
                insertLinks(detailsElement, series.items);
                linksList.append(detailsElement);
            }

            insertLinks(linksList, ITEMS.standalone);
        </script>
        <script>
            const searchBar = document.getElementById("search");
            const searchLinks = linksList.querySelectorAll("a");
            const searchCategories = linksList.querySelectorAll("summary");
            searchBar.addEventListener("search", () => {
                let searchValue = searchBar.value.toLowerCase();
                for (let i=0; i<searchLinks.length; i++) {
                    let searchLink = searchLinks[i];
                    if (searchLink.parentElement.id == "videos") {
                        searchLink.style.display = searchLink.textContent.toLowerCase().includes(searchValue) ? "flex" : "none";
                    }
                }
                for (let i=0; i<searchCategories.length; i++) {
                    let categorySummary = searchCategories[i];
                    let searchCategory = categorySummary.parentElement;
                    let shouldShow = false;
                    let itemLinks = searchCategory.querySelectorAll("a");
                    for (let i=0; i<itemLinks.length; i++) {
                        if (itemLinks[i].textContent.toLowerCase().includes(searchValue)) {
                            shouldShow = true;
                            break;
                        }
                    }
                    if (categorySummary.textContent.toLowerCase().includes(searchValue)) {
                        shouldShow = true;
                    }
                    searchCategory.style.display = shouldShow ? "block" : "none"; 
                }
            })
        </script>
